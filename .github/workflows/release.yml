name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: # recovery of a stuck draft, run on the tag itself
    inputs:
      tag_name:
        description: Draft release tag to build and publish; run this workflow on the same tag
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.event_name == 'push'
    uses: furedea/reusable-workflows/.github/workflows/release-pr.yml@1a18c887067769099a2ded00f0fe398c7bd371bc # v1.2.0
    permissions: {}
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  build:
    needs: release-pr
    if: ${{ !cancelled() && (needs.release-pr.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ needs.release-pr.outputs.tag_name || inputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.TAG_NAME }}

      - name: Verify version file
        run: |
          set -euo pipefail

          # The binary reports cmd/rater/version.txt, which the release PR updated.
          want="v$(<cmd/rater/version.txt)"
          if [[ "$TAG_NAME" != "$want" ]]; then
            echo "$TAG_NAME does not match cmd/rater/version.txt ($want)."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Build release artifacts
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          mkdir -p build dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            name="rater_${version}_${target%/*}_${target#*/}"
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -ldflags "-s -w" -o "build/$name/rater" ./cmd/rater
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)

      - name: Smoke test packaged archive
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          tmpdir="$(mktemp -d)"
          tar -xzf "dist/rater_${version}_linux_amd64.tar.gz" -C "$tmpdir" --strip-components=1
          (cd dist && sha256sum --check checksums.txt)

          actual="$("$tmpdir/rater" --version)"
          if [[ "$actual" != "rater $version" ]]; then
            echo "packaged binary reports '$actual', expected 'rater $version'."
            exit 1
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  release-publish:
    needs: [release-pr, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: furedea/reusable-workflows/.github/workflows/release-publish.yml@1a18c887067769099a2ded00f0fe398c7bd371bc # v1.2.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag-name: ${{ needs.release-pr.outputs.tag_name || inputs.tag_name }}
