name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Draft release tag to build artifacts for; run the workflow on the same tag
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG_NAME: ${{ inputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.TAG_NAME }}

      - name: Verify release target
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Provenance must name the tagged commit, so the workflow runs on the tag.
          if [[ "$GITHUB_REF" != "refs/tags/$TAG_NAME" ]]; then
            echo "Run this workflow on the release tag itself:"
            echo "  gh workflow run release_artifacts.yml --ref $TAG_NAME -f tag_name=$TAG_NAME"
            exit 1
          fi

          head_sha="$(git rev-parse HEAD)"
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "$TAG_NAME points to $head_sha, but this run is for $GITHUB_SHA."
            exit 1
          fi

          # The binary reports cmd/rater/version.txt, which the release PR updated.
          want="v$(<cmd/rater/version.txt)"
          if [[ "$TAG_NAME" != "$want" ]]; then
            echo "$TAG_NAME does not match cmd/rater/version.txt ($want)."
            exit 1
          fi

          # Re-uploading with --clobber deletes assets first, so never touch a published release.
          is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "$TAG_NAME is already published; ship fixes as a new release instead."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Build release artifacts
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          mkdir -p build dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            name="rater_${version}_${target%/*}_${target#*/}"
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -ldflags "-s -w" -o "build/$name/rater" ./cmd/rater
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)

      - name: Smoke test packaged archive
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          tmpdir="$(mktemp -d)"
          tar -xzf "dist/rater_${version}_linux_amd64.tar.gz" -C "$tmpdir" --strip-components=1
          (cd dist && sha256sum --check checksums.txt)

          actual="$("$tmpdir/rater" --version)"
          if [[ "$actual" != "rater $version" ]]; then
            echo "packaged binary reports '$actual', expected 'rater $version'."
            exit 1
          fi

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload release artifacts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" dist/*.tar.gz dist/checksums.txt --clobber

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Publishing without make_latest marks the release latest. An older tag's run
          # can finish last, so let GitHub pick latest by date and semantic version.
          release_id="$(gh release view "$TAG_NAME" --json databaseId --jq .databaseId)"
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=legacy
