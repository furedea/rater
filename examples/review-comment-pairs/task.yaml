name: review-comment-pairs
# Two fields side by side; stacked when the terminal is narrower than 63 columns.
layout: side-by-side
header: [repo, pr]
fields:
  - name: comment_a
    title: Review comment A
  - name: comment_b
    title: Review comment B
labels:
  - {key: s, name: same}
  - {key: p, name: partial}
  - {key: d, name: distinct}
