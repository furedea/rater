name: guideline-criteria
layout: stacked
fields:
  - name: sentence
    title: Guideline sentence
# Each criterion takes one answer; the verdict is derived, never stored.
checklist:
  criteria:
    - {name: concrete, title: Names a concrete code construct}
    - {name: checkable, title: Can be judged from a diff alone}
    - {name: actionable, title: Says what to do}
    - {name: scoped, title: States where it applies}
    - {name: single, title: Covers one rule only}
  answers:
    - {key: y, name: "yes"}
    - {key: "n", name: "no"}
    - {key: "?", name: unsure}
  # all_pass: pass when every criterion is "yes", fail when any is "no", else undecided.
  verdict: {rule: all_pass, pass: "yes", fail: "no"}
